version: 2
updates:
  # Runtime + dev dependencies are pinned, so an upgrade is always an explicit PR that
  # has to pass the full pipeline before it can land.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        patterns: ["pytest*", "ruff", "mypy", "respx", "pre-commit", "pip-audit"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: monthly
