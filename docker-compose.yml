# Local production-like stack:  docker compose up --build
#
# Add the metrics stack (Prometheus scraping /metrics) with:
#   docker compose --profile observability up --build

services:
  app:
    build:
      context: .
      args:
        # Local builds skip the model prefetch to keep the loop fast; it downloads
        # lazily on first use. Production images are built with PREFETCH_MODEL=1.
        PREFETCH_MODEL: "0"
    image: meetsaransh:local
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      LOG_JSON: "true"
      # Secrets come from the environment, never from the image or a committed file.
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      # Required: the app refuses to start in production without it, because a
      # per-process random secret would log every user out on each restart.
      #   export JWT_SECRET=$(python -c "import secrets; print(secrets.token_urlsafe(48))")
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET before starting - see .env.example}
      # Behind compose there is no trusted proxy rewriting X-Forwarded-For, so the
      # rate limiter keys on the real peer address instead.
      TRUST_PROXY_HEADERS: "false"
    volumes:
      # Named volume: the database and uploaded audio survive `docker compose down`.
      - meetsaransh-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys, json
          r = urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=4)
          sys.exit(0 if json.load(r)["status"] == "ok" else 1)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["observability"]
    ports:
      - "9090:9090"
    volumes:
      - ./ops/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  meetsaransh-data:
